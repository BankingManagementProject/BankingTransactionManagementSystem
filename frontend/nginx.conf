server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  location /api/notifications/ {
    proxy_pass http://notification-service:8000/api/notifications/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /api/auth/ {
    proxy_pass http://identity-service:8000/api/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /api/admin/saga-test-transfers {
    proxy_pass http://transaction-service:8000/api/admin/saga-test-transfers;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /api/transfers {
    proxy_pass http://transaction-service:8000/api/transfers;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /api/transactions/ {
    proxy_pass http://transaction-service:8000/api/transactions/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /api/transactions {
    proxy_pass http://transaction-service:8000/api/transactions;
    proxy_set_header Host $host;
  }
  location /api/ {
    proxy_pass http://account-service:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / { try_files $uri $uri/ /index.html; }
}
